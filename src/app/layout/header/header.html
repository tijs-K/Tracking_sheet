<header
  class="flex h-20 w-full items-center justify-between border-b border-gray-300 bg-white px-6 transition-colors duration-200 sm:px-10 dark:border-neutral-800 dark:bg-[#1A1A1A]"
>
  <nav class="flex items-center gap-6 sm:gap-8">
    <a
      routerLink="/dashboard"
      routerLinkActive="text-black dark:text-white font-semibold border-b-2 border-black dark:border-white"
      [routerLinkActiveOptions]="{ exact: false }"
      class="py-1 text-sm font-medium text-gray-500 transition-colors hover:text-black dark:text-neutral-400 dark:hover:text-white"
    >
      Dashboard
    </a>
    <a
      routerLink="/applications"
      routerLinkActive="text-black dark:text-white font-semibold border-b-2 border-black dark:border-white"
      class="py-1 text-sm font-medium text-gray-500 transition-colors hover:text-black dark:text-neutral-400 dark:hover:text-white"
    >
      Applications
    </a>
    <a
      routerLink="/settings"
      routerLinkActive="text-black dark:text-white font-semibold border-b-2 border-black dark:border-white"
      class="py-1 text-sm font-medium text-gray-500 transition-colors hover:text-black dark:text-neutral-400 dark:hover:text-white"
    >
      Settings
    </a>
  </nav>

  <div class="flex items-center gap-4">
    <button
      type="button"
      routerLink="/add-application"
      class="flex h-11 items-center gap-2 rounded-2xl bg-[#1A1A1A] px-4 text-sm font-medium text-white transition hover:bg-black dark:bg-white dark:text-black dark:hover:bg-neutral-200"
    >
      <span class="text-xl leading-none">+</span>
      <p class="hidden sm:inline">Add application</p>
    </button>
    <img
      class="h-10 w-10 rounded-full border border-gray-200 dark:border-neutral-700"
      src="/favicon.ico"
      alt="Profile"
    />
  </div>
</header>
