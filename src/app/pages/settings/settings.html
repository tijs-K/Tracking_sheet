<section
  class="flex min-h-[calc(100vh-5rem)] items-center justify-center px-4 py-8 sm:px-6 lg:px-8"
>
  <div class="w-full max-w-4xl">
    <app-tile>
      <!-- Header -->
      <div class="mb-6 border-b border-gray-100 pb-4 dark:border-neutral-800">
        <div class="mb-1">
          <span class="text-sm font-medium text-gray-400 dark:text-neutral-500">Settings / </span>
          <span class="text-sm font-medium text-gray-700 dark:text-neutral-300">Preferences</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Settings</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-neutral-400">
          Customize your theme preferences.
        </p>
      </div>

      <div class="space-y-7">
        <!-- Appearance / Theme Section -->
        <div>
          <div class="mb-3">
            <h2 class="text-sm font-semibold text-gray-900 dark:text-white">Appearance</h2>
            <p class="text-xs text-gray-500 dark:text-neutral-400">
              Choose how Tracking Sheet looks on your device.
            </p>
          </div>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <!-- Light Mode -->
            <button
              type="button"
              (click)="selectTheme('light')"
              class="relative flex cursor-pointer flex-col items-center rounded-xl border-2 p-4 text-center transition-all hover:bg-gray-50 dark:hover:bg-[#282828]"
              [class.border-black]="selectedTheme === 'light'"
              [class.dark:border-white]="selectedTheme === 'light'"
              [class.bg-white]="selectedTheme === 'light'"
              [class.dark:bg-[#242424]]="selectedTheme === 'light'"
              [class.shadow-sm]="selectedTheme === 'light'"
              [class.border-gray-200]="selectedTheme !== 'light'"
              [class.dark:border-neutral-800]="selectedTheme !== 'light'"
            >
              <div
                class="flex h-16 w-full flex-col justify-between rounded-lg border border-gray-200 bg-[#EBEAE6] p-2.5 shadow-inner"
              >
                <div class="flex items-center justify-between">
                  <span class="h-1.5 w-10 rounded bg-gray-400"></span>
                  <span class="h-2.5 w-2.5 rounded-full bg-black"></span>
                </div>
                <div class="space-y-1.5">
                  <div class="h-2.5 w-full rounded bg-white shadow-xs"></div>
                  <div class="h-2.5 w-3/4 rounded bg-white shadow-xs"></div>
                </div>
              </div>
              <div class="mt-3 flex w-full items-center justify-between px-0.5">
                <div>
                  <p class="text-left text-sm font-semibold text-gray-900 dark:text-white">Light</p>
                  <p class="text-left text-[11px] text-gray-400 dark:text-neutral-400">
                    Bright and clear
                  </p>
                </div>
                @if (selectedTheme === 'light') {
                  <span
                    class="flex h-4 w-4 items-center justify-center rounded-full bg-black text-[10px] text-white dark:bg-white dark:text-black"
                    >✓</span
                  >
                }
              </div>
            </button>

            <!-- Dark Mode -->
            <button
              type="button"
              (click)="selectTheme('dark')"
              class="relative flex cursor-pointer flex-col items-center rounded-xl border-2 p-4 text-center transition-all hover:bg-gray-50 dark:hover:bg-[#282828]"
              [class.border-black]="selectedTheme === 'dark'"
              [class.dark:border-white]="selectedTheme === 'dark'"
              [class.bg-white]="selectedTheme === 'dark'"
              [class.dark:bg-[#242424]]="selectedTheme === 'dark'"
              [class.shadow-sm]="selectedTheme === 'dark'"
              [class.border-gray-200]="selectedTheme !== 'dark'"
              [class.dark:border-neutral-800]="selectedTheme !== 'dark'"
            >
              <div
                class="flex h-16 w-full flex-col justify-between rounded-lg border border-gray-800 bg-[#121212] p-2.5 shadow-inner"
              >
                <div class="flex items-center justify-between">
                  <span class="h-1.5 w-10 rounded bg-gray-600"></span>
                  <span class="h-2.5 w-2.5 rounded-full bg-gray-400"></span>
                </div>
                <div class="space-y-1.5">
                  <div class="h-2.5 w-full rounded bg-[#1E1E1E]"></div>
                  <div class="h-2.5 w-3/4 rounded bg-[#1E1E1E]"></div>
                </div>
              </div>
              <div class="mt-3 flex w-full items-center justify-between px-0.5">
                <div>
                  <p class="text-left text-sm font-semibold text-gray-900 dark:text-white">Dark</p>
                  <p class="text-left text-[11px] text-gray-400 dark:text-neutral-400">
                    Easy on the eyes
                  </p>
                </div>
                @if (selectedTheme === 'dark') {
                  <span
                    class="flex h-4 w-4 items-center justify-center rounded-full bg-black text-[10px] text-white dark:bg-white dark:text-black"
                    >✓</span
                  >
                }
              </div>
            </button>

            <!-- System Default -->
            <button
              type="button"
              (click)="selectTheme('system')"
              class="relative flex cursor-pointer flex-col items-center rounded-xl border-2 p-4 text-center transition-all hover:bg-gray-50 dark:hover:bg-[#282828]"
              [class.border-black]="selectedTheme === 'system'"
              [class.dark:border-white]="selectedTheme === 'system'"
              [class.bg-white]="selectedTheme === 'system'"
              [class.dark:bg-[#242424]]="selectedTheme === 'system'"
              [class.shadow-sm]="selectedTheme === 'system'"
              [class.border-gray-200]="selectedTheme !== 'system'"
              [class.dark:border-neutral-800]="selectedTheme !== 'system'"
            >
              <div
                class="flex h-16 w-full overflow-hidden rounded-lg border border-gray-300 shadow-inner dark:border-neutral-700"
              >
                <div class="flex w-1/2 flex-col justify-between bg-[#EBEAE6] p-2">
                  <span class="h-1.5 w-7 rounded bg-gray-400"></span>
                  <div class="h-2.5 w-full rounded bg-white shadow-xs"></div>
                </div>
                <div class="flex w-1/2 flex-col justify-between bg-[#121212] p-2">
                  <span class="h-1.5 w-7 rounded bg-gray-600"></span>
                  <div class="h-2.5 w-full rounded bg-[#1E1E1E]"></div>
                </div>
              </div>
              <div class="mt-3 flex w-full items-center justify-between px-0.5">
                <div>
                  <p class="text-left text-sm font-semibold text-gray-900 dark:text-white">
                    System
                  </p>
                  <p class="text-left text-[11px] text-gray-400 dark:text-neutral-400">
                    Follows device
                  </p>
                </div>
                @if (selectedTheme === 'system') {
                  <span
                    class="flex h-4 w-4 items-center justify-center rounded-full bg-black text-[10px] text-white dark:bg-white dark:text-black"
                    >✓</span
                  >
                }
              </div>
            </button>
          </div>
        </div>
      </div>
    </app-tile>
  </div>
</section>
